name: Security

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday at 2 AM UTC
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.1.0, 2.1.0-rc.1)'
        required: true
        type: string

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  docker-scan:
    name: Docker Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: eks-helm-client:scan

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: eks-helm-client:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

      - name: Create Security Summary
        run: |
          echo "## 🔒 Container Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          trivy image --severity CRITICAL,HIGH --format table eks-helm-client:scan >> $GITHUB_STEP_SUMMARY || echo "No vulnerabilities found" >> $GITHUB_STEP_SUMMARY

  dockerfile-lint:
    name: Dockerfile Security Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yml
          format: sarif
          output-file: hadolint-results.sarif
          no-fail: true

      - name: Upload Hadolint Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-results.sarif
          category: 'dockerfile-lint'

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'eks-helm-client-github-action'
          path: '.'
          format: 'ALL'
          args: >
            --enableRetired
            --enableExperimental
            
      - name: Upload OWASP Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: 'dependency-check'

  security-policy:
    name: Security Policy Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Security Files
        run: |
          echo "## 📋 Security Policy Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check for security policy
          if [[ -f "SECURITY.md" ]] || [[ -f "docs/SECURITY.md" ]] || [[ -f ".github/SECURITY.md" ]]; then
            echo "✅ Security policy found" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Security policy missing" >> $GITHUB_STEP_SUMMARY
            echo "::warning::Security policy file not found"
          fi
          
          # Check .gitignore for sensitive patterns
          if [[ -f ".gitignore" ]]; then
            echo "✅ .gitignore exists" >> $GITHUB_STEP_SUMMARY
            
            patterns=(".env" "*.key" "*.pem" "secrets/" "kubeconfig")
            missing=()
            for pattern in "${patterns[@]}"; do
              if ! grep -q "$pattern" .gitignore; then
                missing+=("$pattern")
              fi
            done
            
            if [[ ${#missing[@]} -eq 0 ]]; then
              echo "✅ All sensitive patterns in .gitignore" >> $GITHUB_STEP_SUMMARY
            else
              echo "⚠️ Missing patterns in .gitignore: ${missing[*]}" >> $GITHUB_STEP_SUMMARY
              echo "::warning::Add these patterns to .gitignore: ${missing[*]}"
            fi
          else
            echo "❌ .gitignore missing" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check License File
        run: |
          if [[ -f "LICENSE" ]] || [[ -f "LICENSE.md" ]]; then
            echo "✅ License file found" >> $GITHUB_STEP_SUMMARY
            
            # Extract license type
            if grep -qi "MIT" LICENSE* 2>/dev/null; then
              echo "📄 License type: MIT" >> $GITHUB_STEP_SUMMARY
            elif grep -qi "Apache" LICENSE* 2>/dev/null; then
              echo "📄 License type: Apache" >> $GITHUB_STEP_SUMMARY
            else
              echo "📄 License type: Other" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "❌ License file missing" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [docker-scan, dockerfile-lint, security-policy, license-check]
    if: always()
    
    steps:
      - name: Create Summary
        run: |
          echo "# 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Container Security | ${{ needs.docker-scan.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile Lint | ${{ needs.dockerfile-lint.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Policy | ${{ needs.security-policy.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| License | ${{ needs.license-check.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Create Issue on Failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security Scan Failed - ${date}`,
              body: `The scheduled security scan has failed. Please check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.`,
              labels: ['security', 'automated']
            });