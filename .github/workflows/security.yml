name: Security & Code Quality

on:
  pull_request:
    branches: [dev, master, main]
  push:
    branches: [dev, master, main]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Build Docker image for scanning
        run: |
          docker build -t security-scan:latest .

      - name: Run Trivy scanner on Docker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'security-scan:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint shell scripts
        run: |
          if command -v shellcheck &> /dev/null; then
            find . -name "*.sh" -type f -exec shellcheck {} \;
          else
            echo "⚠️ shellcheck not available, skipping"
          fi

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Validate action.yml
        run: |
          python3 -c "
          import yaml
          import sys
          
          with open('action.yml', 'r') as f:
              action = yaml.safe_load(f)
          
          required_fields = ['name', 'description', 'runs']
          for field in required_fields:
              if field not in action:
                  print(f'❌ Missing required field: {field}')
                  sys.exit(1)
          
          if 'branding' not in action:
              print('⚠️ Warning: Missing branding section')
          
          inputs = action.get('inputs', {})
          required_inputs = [name for name, config in inputs.items() if config.get('required', False)]
          
          print(f'✅ Action: {action[\"name\"]}')
          print(f'📝 Description: {action[\"description\"]}')
          print(f'🔧 Total inputs: {len(inputs)}')
          print(f'⚠️ Required inputs: {len(required_inputs)}')
          print('✅ action.yml validation passed')
          "