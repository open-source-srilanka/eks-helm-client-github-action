name: Release to Marketplace

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.1.0, 2.1.0-rc.1)'
        required: true
        type: string
      release_type:
        description: 'Type of release'
        required: true
        type: choice
        options:
          - rc
          - stable
        default: rc

  # Auto-trigger on tag push
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Release Variables
        id: setup
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            RELEASE_TYPE="${{ github.event.inputs.release_type }}"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            if [[ "$VERSION" == *"-rc"* ]]; then
              RELEASE_TYPE="rc"
            else
              RELEASE_TYPE="stable"
            fi
          fi
          
          # Validate version format
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Invalid version format: $VERSION"
            exit 1
          fi
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_type=$RELEASE_TYPE" >> $GITHUB_OUTPUT
          echo "tag_name=v$VERSION" >> $GITHUB_OUTPUT
          
          if [[ "$RELEASE_TYPE" == "rc" ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
          
          echo "🚀 Releasing version: $VERSION ($RELEASE_TYPE)"

      - name: Build and Test
        run: |
          # Basic functionality test
          docker build -t test-action:${{ steps.setup.outputs.version }} .
          
          # Quick validation test
          docker run --rm \
            -e INPUT_CLUSTER_NAME=test-cluster \
            -e INPUT_REGION=us-west-2 \
            -e INPUT_HELM_COMMANDS="helm version" \
            -e INPUT_DRY_RUN=true \
            -e INPUT_DEBUG=true \
            test-action:${{ steps.setup.outputs.version }}

      - name: Generate Changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [[ -n "$LAST_TAG" ]]; then
            echo "## 📋 Changes since $LAST_TAG" > changelog.md
            echo "" >> changelog.md
            git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges >> changelog.md
          else
            echo "## 🎉 Initial Release" > changelog.md
            echo "" >> changelog.md
            echo "First release of the EKS Helm Client GitHub Action." >> changelog.md
          fi
          
          echo 'changelog<<EOF' >> $GITHUB_OUTPUT
          cat changelog.md >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Create Git Tag
        run: |
          VERSION="${{ steps.setup.outputs.version }}"
          
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          
          # Update major version tag for stable releases
          if [[ "${{ steps.setup.outputs.release_type }}" == "stable" ]]; then
            MAJOR_VERSION=$(echo $VERSION | cut -d. -f1)
            git tag -f "v$MAJOR_VERSION"
            git push -f origin "v$MAJOR_VERSION"
            echo "✅ Updated major version tag: v$MAJOR_VERSION"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.setup.outputs.tag_name }}
          name: 'EKS Helm Client v${{ steps.setup.outputs.version }}'
          body: |
            ## EKS Helm Client GitHub Action v${{ steps.setup.outputs.version }}
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## 🚀 Usage
            
            ```yaml
            - name: Deploy Helm Chart
              uses: ${{ github.repository }}@v${{ steps.setup.outputs.version }}
              with:
                cluster-name: my-cluster
                region: us-west-2
                helm-commands: |
                  helm upgrade --install my-app ./chart
            ```
            
            ## 🔒 Private Registry Support
            
            This version includes comprehensive support for private Helm packages:
            - AWS ECR with automatic authentication
            - GitHub Container Registry integration
            - Private Helm repositories with secure credentials
            
            ${{ steps.setup.outputs.release_type == 'rc' && '## ⚠️ Release Candidate
            
            This is a release candidate version for testing. Not recommended for production use.' || '' }}
            
            ## 📚 Documentation
            
            - [README](https://github.com/${{ github.repository }}/blob/v${{ steps.setup.outputs.version }}/README.md)
            - [Examples](https://github.com/${{ github.repository }}/blob/v${{ steps.setup.outputs.version }}/examples/private-helm-examples.yml)
            
            ---
            
            **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...v${{ steps.setup.outputs.version }}
          prerelease: ${{ steps.setup.outputs.is_prerelease }}
          draft: false

      - name: Marketplace Publication Notice
        run: |
          echo "🎉 Release v${{ steps.setup.outputs.version }} created!"
          echo ""
          echo "📦 Release Type: ${{ steps.setup.outputs.release_type }}"
          echo "🏷️ Tag: ${{ steps.setup.outputs.tag_name }}"
          echo "🔗 Release URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.setup.outputs.tag_name }}"
          echo ""
          
          if [[ "${{ steps.setup.outputs.release_type }}" == "stable" ]]; then
            echo "✅ This stable release will be published to GitHub Marketplace as LATEST"
            echo "👥 Users can reference: @v${{ steps.setup.outputs.version }} or @v$(echo ${{ steps.setup.outputs.version }} | cut -d. -f1)"
          else
            echo "🧪 This RC release will be published to GitHub Marketplace as PRERELEASE"
            echo "👥 Users can reference: @v${{ steps.setup.outputs.version }} for testing"
          fi
          
          # Create workflow summary
          echo "## 📦 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version**: v${{ steps.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ steps.setup.outputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Marketplace Status**: Published" >> $GITHUB_STEP_SUMMARY
          echo "- **Release URL**: [${{ steps.setup.outputs.tag_name }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.setup.outputs.tag_name }})" >> $GITHUB_STEP_SUMMARY