name: Test Suite

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.sh'
      - '**.template'
      - 'Dockerfile'
      - 'action.yml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.sh'
      - '**.template'
      - 'Dockerfile'
      - 'action.yml'
      - '.github/workflows/test.yml'
  workflow_dispatch:
    inputs:
      test_level:
        description: 'Test level to run'
        required: false
        default: 'full'
        type: choice
        options:
          - basic
          - full
          - integration
      skip_integration:
        description: 'Skip integration tests'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Static Analysis and Linting
  lint:
    name: Lint and Static Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yml
          failure-threshold: error

      - name: Lint Shell Scripts
        run: |
          # Install shellcheck
          sudo apt-get update
          sudo apt-get install -y shellcheck
          
          echo "🔍 Linting shell scripts..."
          find . -name "*.sh" -type f | while read -r file; do
            echo "Checking $file"
            shellcheck "$file" || exit 1
          done
          
          echo "✅ Shell script linting passed"

      - name: Validate YAML Files
        run: |
          # Install yq
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          
          echo "🔍 Validating YAML files..."
          
          # Validate action.yml
          yq eval '.' action.yml > /dev/null
          echo "✅ action.yml is valid"
          
          # Validate workflow files
          find .github/workflows -name "*.yml" -o -name "*.yaml" | while read -r file; do
            echo "Validating $file"
            yq eval '.' "$file" > /dev/null || exit 1
          done
          
          echo "✅ YAML validation passed"

      - name: Validate Templates
        run: |
          echo "🔍 Validating configuration templates..."
          
          # Test config template with sample values
          export ENDPOINT_URL="https://test.eks.amazonaws.com"
          export CA_CERT="LS0tLS1CRUdJTi1DZXJ0aWZpY2F0ZS0tLS0t"
          export CLUSTER_NAME="test-cluster"
          export REGION_CODE="us-west-2"
          export AWS_ACCOUNT_ID="123456789012"
          
          # Validate config template
          if envsubst < templates/config.template | yq eval '.' - > /dev/null; then
            echo "✅ config.template is valid"
          else
            echo "❌ config.template validation failed"
            exit 1
          fi
          
          # Validate private config template
          export PRIVATE_CLUSTER="true"
          export VPC_ID="vpc-12345678"
          if envsubst < templates/private-config.template | yq eval '.' - > /dev/null; then
            echo "✅ private-config.template is valid"
          else
            echo "❌ private-config.template validation failed"
            exit 1
          fi
          
          # Validate helm values template
          export APP_NAME="test-app"
          export IMAGE_REPOSITORY="nginx"
          export IMAGE_TAG="latest"
          if envsubst < templates/helm-values.template | yq eval '.' - > /dev/null; then
            echo "✅ helm-values.template is valid"
          else
            echo "❌ helm-values.template validation failed"
            exit 1
          fi

      - name: Check Script Permissions
        run: |
          echo "🔍 Checking script permissions..."
          
          scripts=("scripts/entrypoint.sh" "scripts/health-check.sh" "scripts/setup-tools.sh" "scripts/cleanup.sh")
          
          for script in "${scripts[@]}"; do
            if [[ -f "$script" ]]; then
              if [[ -x "$script" ]]; then
                echo "✅ $script is executable"
              else
                echo "❌ $script is not executable"
                exit 1
              fi
            else
              echo "❌ $script not found"
              exit 1
            fi
          done

  # Security Scanning
  security:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: Check for Sensitive Files
        run: |
          echo "🔍 Checking for sensitive files..."
          
          # Check for common sensitive file patterns
          sensitive_patterns=(
            "*.pem"
            "*.key"
            "*.p12"
            "*.pfx"
            "*password*"
            "*secret*"
            "*credential*"
            "*.env"
          )
          
          found_sensitive=false
          for pattern in "${sensitive_patterns[@]}"; do
            if find . -name "$pattern" -type f | grep -v .git | head -1; then
              echo "❌ Found potentially sensitive files matching: $pattern"
              found_sensitive=true
            fi
          done
          
          if [[ "$found_sensitive" == "true" ]]; then
            echo "❌ Sensitive files detected"
            exit 1
          else
            echo "✅ No sensitive files detected"
          fi

  # Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        test-suite:
          - entrypoint
          - health-check
          - setup-tools
          - cleanup
          - templates
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Test Environment
        run: |
          # Install testing dependencies
          sudo apt-get update
          sudo apt-get install -y bats curl jq yq
          
          # Install shellcheck for script validation
          sudo apt-get install -y shellcheck
          
          # Create test directories
          mkdir -p test-results

      - name: Run Unit Tests - ${{ matrix.test-suite }}
        run: |
          echo "🧪 Running unit tests for: ${{ matrix.test-suite }}"
          
          case "${{ matrix.test-suite }}" in
            entrypoint)
              # Test entrypoint.sh functionality
              bash tests/unit/test-entrypoint.sh
              ;;
            health-check)
              # Test health-check.sh
              bash tests/unit/test-health-check.sh
              ;;
            setup-tools)
              # Test setup-tools.sh
              bash tests/unit/test-setup-tools.sh
              ;;
            cleanup)
              # Test cleanup.sh
              bash tests/unit/test-cleanup.sh
              ;;
            templates)
              # Test template generation
              bash tests/unit/test-templates.sh
              ;;
          esac

      - name: Create Unit Test Placeholders
        if: failure()
        run: |
          # Create basic unit test files if they don't exist
          mkdir -p tests/unit
          
          cat > tests/unit/test-${{ matrix.test-suite }}.sh << 'EOF'
          #!/bin/bash
          # Unit tests for ${{ matrix.test-suite }}
          
          set -e
          
          echo "🧪 Testing ${{ matrix.test-suite }} functionality"
          
          # Test script exists and is executable
          script_path="scripts/${{ matrix.test-suite }}.sh"
          if [[ -f "$script_path" && -x "$script_path" ]]; then
            echo "✅ Script exists and is executable: $script_path"
          else
            echo "❌ Script not found or not executable: $script_path"
            exit 1
          fi
          
          # Test script syntax
          if bash -n "$script_path"; then
            echo "✅ Script syntax is valid"
          else
            echo "❌ Script syntax error"
            exit 1
          fi
          
          # Test with shellcheck
          if command -v shellcheck >/dev/null 2>&1; then
            if shellcheck "$script_path"; then
              echo "✅ Shellcheck passed"
            else
              echo "❌ Shellcheck failed"
              exit 1
            fi
          fi
          
          echo "✅ Unit tests passed for ${{ matrix.test-suite }}"
          EOF
          
          chmod +x tests/unit/test-${{ matrix.test-suite }}.sh
          
          # Run the placeholder test
          bash tests/unit/test-${{ matrix.test-suite }}.sh

  # Container Build and Test
  container-tests:
    name: Container Build and Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          tags: test-action:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/test-action.tar

      - name: Load and Test Container
        if: matrix.platform == 'linux/amd64'
        run: |
          # Load the image
          docker load --input /tmp/test-action.tar
          
          echo "🧪 Testing container functionality"
          
          # Test basic container startup
          docker run --rm test-action:latest /health-check.sh --quick
          
          # Test tool availability
          docker run --rm test-action:latest bash -c "
            echo '=== Tool Versions ==='
            kubectl version --client --short
            helm version --short
            aws --version
            echo '=== Health Check ==='
            /health-check.sh
          "
          
          # Test script permissions
          docker run --rm test-action:latest bash -c "
            echo '=== Script Permissions ==='
            ls -la /entrypoint.sh /health-check.sh /setup-tools.sh /cleanup.sh
            echo '=== Script Syntax Check ==='
            bash -n /entrypoint.sh
            bash -n /health-check.sh
            bash -n /setup-tools.sh
            bash -n /cleanup.sh
          "

      - name: Test Container Security
        if: matrix.platform == 'linux/amd64'
        run: |
          echo "🔒 Testing container security"
          
          # Test non-root user
          user_id=$(docker run --rm test-action:latest id -u)
          if [[ "$user_id" != "0" ]]; then
            echo "✅ Container runs as non-root user (UID: $user_id)"
          else
            echo "❌ Container running as root"
            exit 1
          fi
          
          # Test file permissions
          docker run --rm test-action:latest bash -c "
            echo 'Testing write permissions to /tmp'
            echo 'test' > /tmp/test.txt && rm /tmp/test.txt
            echo '✅ /tmp is writable'
            
            echo 'Testing read-only root filesystem simulation'
            if [[ ! -w / ]]; then
              echo '✅ Root filesystem appears read-only to user'
            else
              echo '⚠️ Root filesystem is writable (expected in test)'
            fi
          "

  # Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_integration && github.event_name != 'pull_request' }}
    
    strategy:
      matrix:
        test-scenario:
          - public-cluster-basic
          - public-cluster-advanced
          - private-registry-simulation
          - tool-version-matrix
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Test Environment
        run: |
          # Install testing tools
          sudo apt-get update
          sudo apt-get install -y curl jq
          
          # Setup kubectl
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          
          # Setup Helm
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          
          # Setup kind for local Kubernetes testing
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/

      - name: Create Test Cluster
        run: |
          echo "🚀 Creating test Kubernetes cluster"
          
          # Create kind cluster
          kind create cluster --name test-cluster --config - <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            kubeadmConfigPatches:
            - |
              kind: InitConfiguration
              nodeRegistration:
                kubeletExtraArgs:
                  node-labels: "ingress-ready=true"
            extraPortMappings:
            - containerPort: 80
              hostPort: 80
              protocol: TCP
            - containerPort: 443
              hostPort: 443
              protocol: TCP
          EOF
          
          # Wait for cluster to be ready
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
          
          echo "✅ Test cluster is ready"

      - name: Run Integration Test - ${{ matrix.test-scenario }}
        run: |
          echo "🧪 Running integration test: ${{ matrix.test-scenario }}"
          
          case "${{ matrix.test-scenario }}" in
            public-cluster-basic)
              # Test basic functionality with kind cluster
              echo "Testing basic deployment to local cluster"
              
              # Test kubectl connectivity
              kubectl cluster-info
              
              # Test Helm functionality
              helm repo add bitnami https://charts.bitnami.com/bitnami
              helm repo update
              
              # Simulate action execution
              export CLUSTER_NAME="test-cluster"
              export REGION_CODE="local"
              export INPUT_DEBUG="true"
              export INPUT_DRY_RUN="true"
              
              # Test template generation
              bash scripts/entrypoint.sh "helm version"
              ;;
              
            public-cluster-advanced)
              # Test advanced features
              echo "Testing advanced deployment features"
              
              # Test with specific tool versions
              export CLUSTER_NAME="test-cluster"
              export REGION_CODE="local"
              export INPUT_KUBECTL_VERSION="1.28.4"
              export INPUT_HELM_VERSION="3.13.3"
              export INPUT_DEBUG="true"
              
              # Test health check
              bash scripts/health-check.sh
              
              # Test tool setup
              sudo bash scripts/setup-tools.sh --verify-only
              ;;
              
            private-registry-simulation)
              # Simulate private registry functionality
              echo "Testing private registry simulation"
              
              # Test registry secret creation
              export PRIVATE_REGISTRY_ENABLED="true"
              export HELM_REGISTRY_URL="https://harbor.example.com"
              export HELM_REGISTRY_USERNAME="testuser"
              export HELM_REGISTRY_PASSWORD="testpass"
              
              # Create a test namespace
              kubectl create namespace test-registry
              
              # Test registry secret creation (dry run)
              kubectl create secret docker-registry test-regcred \
                --docker-server="$HELM_REGISTRY_URL" \
                --docker-username="$HELM_REGISTRY_USERNAME" \
                --docker-password="$HELM_REGISTRY_PASSWORD" \
                --namespace=test-registry \
                --dry-run=client -o yaml
              ;;
              
            tool-version-matrix)
              # Test different tool versions
              echo "Testing tool version compatibility"
              
              versions=(
                "kubectl:1.28.4,helm:3.13.3"
                "kubectl:1.27.1,helm:3.12.3"
              )
              
              for version_combo in "${versions[@]}"; do
                IFS=',' read -ra VERSIONS <<< "$version_combo"
                kubectl_ver=$(echo "${VERSIONS[0]}" | cut -d':' -f2)
                helm_ver=$(echo "${VERSIONS[1]}" | cut -d':' -f2)
                
                echo "Testing kubectl:$kubectl_ver, helm:$helm_ver"
                
                export INPUT_KUBECTL_VERSION="$kubectl_ver"
                export INPUT_HELM_VERSION="$helm_ver"
                
                # Test version installation
                sudo bash scripts/setup-tools.sh --kubectl-version "$kubectl_ver" --helm-version "$helm_ver" --verify-only
              done
              ;;
          esac

      - name: Cleanup Test Environment
        if: always()
        run: |
          echo "🧹 Cleaning up test environment"
          kind delete cluster --name test-cluster || true
          bash scripts/cleanup.sh --emergency || true

  # Performance Tests
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Performance Testing
        run: |
          echo "⚡ Setting up performance tests"
          
          # Install time and other performance tools
          sudo apt-get update
          sudo apt-get install -y time

      - name: Test Script Performance
        run: |
          echo "📊 Testing script performance"
          
          # Test health check performance
          echo "Testing health-check.sh performance"
          time_output=$(time bash scripts/health-check.sh 2>&1)
          echo "$time_output"
          
          # Test setup tools performance
          echo "Testing setup-tools.sh performance"
          time_output=$(time bash scripts/setup-tools.sh --verify-only 2>&1)
          echo "$time_output"
          
          # Test cleanup performance
          echo "Testing cleanup.sh performance"
          time_output=$(time bash scripts/cleanup.sh --no-verify 2>&1)
          echo "$time_output"

      - name: Test Container Startup Time
        run: |
          echo "🚀 Testing container startup performance"
          
          # Build test image
          docker build -t perf-test:latest .
          
          # Test container startup time
          echo "Measuring container startup time"
          start_time=$(date +%s%N)
          docker run --rm perf-test:latest /health-check.sh --quick
          end_time=$(date +%s%N)
          
          startup_time=$(( (end_time - start_time) / 1000000 ))
          echo "Container startup time: ${startup_time}ms"
          
          # Fail if startup takes too long (> 10 seconds)
          if [[ $startup_time -gt 10000 ]]; then
            echo "❌ Container startup too slow: ${startup_time}ms"
            exit 1
          else
            echo "✅ Container startup time acceptable: ${startup_time}ms"
          fi

  # Compatibility Tests
  compatibility-tests:
    name: Compatibility Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        kubectl-version: ['1.27.1', '1.28.4', '1.29.0']
        helm-version: ['3.12.3', '3.13.3', '3.14.0']
        exclude:
          # Exclude some combinations to reduce test time
          - kubectl-version: '1.27.1'
            helm-version: '3.14.0'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Tool Compatibility
        run: |
          echo "🔧 Testing kubectl:${{ matrix.kubectl-version }} with helm:${{ matrix.helm-version }}"
          
          # Test tool installation
          export INPUT_KUBECTL_VERSION="${{ matrix.kubectl-version }}"
          export INPUT_HELM_VERSION="${{ matrix.helm-version }}"
          
          # Test setup tools with specific versions
          sudo bash scripts/setup-tools.sh \
            --kubectl-version "${{ matrix.kubectl-version }}" \
            --helm-version "${{ matrix.helm-version }}" \
            --verify-only

      - name: Test Template Compatibility
        run: |
          echo "📋 Testing template compatibility with tool versions"
          
          # Set test environment variables
          export CLUSTER_NAME="test-cluster"
          export REGION_CODE="us-west-2"
          export KUBECTL_VERSION="${{ matrix.kubectl-version }}"
          export HELM_VERSION="${{ matrix.helm-version }}"
          
          # Test template generation
          if envsubst < templates/config.template > /tmp/test-config.yaml; then
            echo "✅ Config template generation successful"
          else
            echo "❌ Config template generation failed"
            exit 1
          fi

  # Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [lint, security, unit-tests, container-tests, compatibility-tests]
    if: always()
    
    steps:
      - name: Generate Test Summary
        run: |
          echo "# 🧪 Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Results Overview" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Category | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Static Analysis | ${{ needs.lint.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scanning | ${{ needs.security.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Tests | ${{ needs.container-tests.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Compatibility Tests | ${{ needs.compatibility-tests.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          
          # Add integration test results if they ran
          if [[ "${{ needs.integration-tests.result }}" != "skipped" ]]; then
            echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.lint.result }}" == "success" && "${{ needs.security.result }}" == "success" && "${{ needs.unit-tests.result }}" == "success" && "${{ needs.container-tests.result }}" == "success" && "${{ needs.compatibility-tests.result }}" == "success" ]]; then
            echo "🎉 All tests passed! The changes are ready for review and merge." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Some tests failed. Please review the failed jobs and fix any issues." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Jobs:" >> $GITHUB_STEP_SUMMARY
            
            [[ "${{ needs.lint.result }}" != "success" ]] && echo "- Lint & Static Analysis" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.security.result }}" != "success" ]] && echo "- Security Scanning" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.unit-tests.result }}" != "success" ]] && echo "- Unit Tests" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.container-tests.result }}" != "success" ]] && echo "- Container Tests" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.compatibility-tests.result }}" != "success" ]] && echo "- Compatibility Tests" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow Run**: [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY