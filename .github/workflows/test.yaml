name: Test

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_IMAGE_TAG: "eks-helm-client:test"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x .github/scripts/testing/*.sh
          chmod +x scripts/*.sh
          chmod +x tests/unit/*.sh

      - name: Run Unit Tests
        run: bash .github/scripts/testing/run-unit-tests.sh

      - name: Run Script Unit Tests
        run: |
          for test_script in tests/unit/test-*.sh; do
            if [[ -f "$test_script" ]]; then
              echo "Running $test_script"
              bash "$test_script" || echo "Test $test_script failed but continuing..."
            fi
          done

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            /tmp/eks-helm-test-*/test-results.txt
            /tmp/template-test-*/
          if-no-files-found: ignore

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Make scripts executable
        run: |
          chmod +x .github/scripts/testing/*.sh
          chmod +x scripts/*.sh

      - name: Run Integration Tests
        run: bash .github/scripts/testing/run-integration-tests.sh

      - name: Upload Docker Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-logs
          path: /tmp/docker-build-*.log
          if-no-files-found: ignore

  action-validation:
    name: Validate Action
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make validation script executable
        run: chmod +x .github/scripts/testing/*.sh

      - name: Validate Action Configuration
        run: bash .github/scripts/testing/validate-action.sh

      - name: Upload Validation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.txt
          if-no-files-found: ignore

  docker-test:
    name: Docker Functionality Test
    runs-on: ubuntu-latest
    needs: integration-tests
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE_TAG }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: integration-tests
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE_TAG }}

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE_TAG }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy Results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-security'

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, action-validation, docker-test, security-scan]
    if: always()
    
    steps:
      - name: Generate Job Summary
        id: summary
        run: |
          echo "## 🧪 Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Action Validation | ${{ needs.action-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Tests | ${{ needs.docker-test.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          
          # Determine overall status
          if [[ "${{ needs.unit-tests.result }}" != "success" || \
                "${{ needs.integration-tests.result }}" != "success" || \
                "${{ needs.action-validation.result }}" != "success" || \
                "${{ needs.docker-test.result }}" != "success" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ **Some tests failed!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failed Tests" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.unit-tests.result }}" != "success" ]] && echo "- Unit Tests" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.integration-tests.result }}" != "success" ]] && echo "- Integration Tests" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.action-validation.result }}" != "success" ]] && echo "- Action Validation" >> $GITHUB_STEP_SUMMARY
            [[ "${{ needs.docker-test.result }}" != "success" ]] && echo "- Docker Tests" >> $GITHUB_STEP_SUMMARY
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
            
            # Add security scan note
            if [[ "${{ needs.security-scan.result }}" == "success" ]]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "🔒 **Security scan completed successfully**" >> $GITHUB_STEP_SUMMARY
            else
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Security scan had issues** (check results)" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          # Add debugging info if enabled
          if [[ "${{ github.event.inputs.debug }}" == "true" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Debug Information" >> $GITHUB_STEP_SUMMARY
            echo "- Debug mode was enabled for this run" >> $GITHUB_STEP_SUMMARY
            echo "- Check individual job logs for detailed debugging output" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail workflow on test failure
        if: steps.summary.outputs.status == 'failure'
        run: |
          echo "::error::One or more test suites failed. Check the job summary for details."
          exit 1

      - name: Success notification
        if: steps.summary.outputs.status == 'success'
        run: |
          echo "::notice::All tests passed successfully! 🎉"