name: Test

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*.*.*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'

  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  DOCKER_IMAGE_TAG: "eks-helm-client:test" # Define image tag for all jobs

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make scripts executable
        # It's best practice to set executable permissions in your Git repository.
        # This step ensures they are executable if not already set.
        run: |
          chmod +x .github/scripts/testing/*.sh
          chmod +x scripts/*.sh

      - name: Run Unit Tests
        # CRITICAL FIX: Removed '|| true' to ensure the workflow fails if tests fail.
        run: bash .github/scripts/testing/run-unit-tests.sh

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: /tmp/eks-helm-test-*/test-results.txt
          if-no-files-found: ignore

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Test Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Integration Tests
        # CORRECTION: This now runs the actual integration test script.
        # The previous matrix only ran a simple 'echo' command inside the container.
        run: .github/scripts/testing/run-integration-tests.sh

  action-validation:
    name: Validate Action
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make validation script executable
        run: chmod +x .github/scripts/testing/validate-action.sh

      - name: Validate Action Configuration
        run: .github/scripts/testing/validate-action.sh

      - name: Upload Validation Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.txt

  test-action:
    name: Test Action
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Action - Dry Run
        uses: ./
        with:
          cluster-name: test-cluster
          region: us-west-2
          dry-run: true
          debug: ${{ inputs.debug || false }}
          args: |
            echo "=== Action Test ==="
            kubectl version --client
            helm version
            aws --version

      - name: Test Action - Private Cluster
        uses: ./
        with:
          cluster-name: private-test-cluster
          region: us-east-1
          private-cluster: true
          dry-run: true
          debug: ${{ inputs.debug || false }}
          args: |
            echo "=== Private Cluster Test ==="
            echo "Private cluster mode enabled"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, action-validation, test-action]
    if: always()
    
    steps:
      - name: Generate Job Summary
        id: summary
        run: |
          echo "## 🧪 Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Action Validation | ${{ needs.action-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Action Test | ${{ needs.test-action.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.unit-tests.result }}" != "success" || "${{ needs.integration-tests.result }}" != "success" || "${{ needs.action-validation.result }}" != "success" || "${{ needs.test-action.result }}" != "success" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ **Some tests failed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ **All tests passed!**" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail workflow on test failure
        if: steps.summary.outputs.status == 'failure'
        run: exit 1

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `## 🧪 Test Results
            
            | Test Suite | Status |
            |------------|--------|
            | Unit Tests | ${{ needs.unit-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Action Validation | ${{ needs.action-validation.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            | Action Test | ${{ needs.test-action.result == 'success' && '✅ Passed' || '❌ Failed' }} |
            
            **Commit**: \`${{ github.event.pull_request.head.sha || github.sha }}\`
            **Workflow**: [Run #${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });